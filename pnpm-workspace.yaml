packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  # Skia 2.14.0 publishes no install script (npm view, 2026-10-20); its libraries come in the react-native-skia-* packages.
  "@shopify/react-native-skia": false
  "@tailwindcss/oxide": true
  "esbuild": true
  "lefthook": true
  # Jest 30 dependencies: their prebuilt platform binaries are optional dependencies, so the fallback
  # install scripts (a source build; napi-postinstall) are not needed (npm view, 2026-10-20).
  "@parcel/watcher": false
  "unrs-resolver": false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.8'
  - '@better-auth/drizzle-adapter@1.7.8'
  - '@better-auth/expo@1.7.8'
  - '@better-auth/kysely-adapter@1.7.8'
  - '@better-auth/memory-adapter@1.7.8'
  - '@better-auth/mongo-adapter@1.7.8'
  - '@better-auth/prisma-adapter@1.7.8'
  - '@better-auth/telemetry@1.7.8'
  - better-auth@1.7.8

overrides:
  lightningcss: 1.30.1

strictPeerDependencies: false
