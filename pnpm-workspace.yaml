packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  # Skia 2.14 ships its libraries in the react-native-skia-* packages and has no install script to run.
  "@shopify/react-native-skia": false
  "@tailwindcss/oxide": true
  "esbuild": true
  "lefthook": true
  # Jest 30 dependencies with prebuilt platform binaries; their source builds are not needed.
  "@parcel/watcher": false
  "unrs-resolver": false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.8'
  - '@better-auth/drizzle-adapter@1.7.8'
  - '@better-auth/expo@1.7.8'
  - '@better-auth/kysely-adapter@1.7.8'
  - '@better-auth/memory-adapter@1.7.8'
  - '@better-auth/mongo-adapter@1.7.8'
  - '@better-auth/prisma-adapter@1.7.8'
  - '@better-auth/telemetry@1.7.8'
  - better-auth@1.7.8

overrides:
  lightningcss: 1.30.1

strictPeerDependencies: false
