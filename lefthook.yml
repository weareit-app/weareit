# Git hooks, installed by `pnpm install` (lefthook's postinstall runs `lefthook install`).
# Skip once with `git commit --no-verify`, or `LEFTHOOK=0 git commit`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      # Formats and lints only what `files.includes` in `biome.jsonc` lets through (code,
      # not docs), the same files CI checks with `pnpm run lint`, applying safe fixes. No
      # glob here, so that list stays the one definition: Biome skips ignored files passed
      # by name, and `--no-errors-on-unmatched` exits 0 when all are ignored.
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # The type-aware pass (eslint.config.mjs) on staged TypeScript; `--no-warn-ignored`
    # keeps a staged file that the config ignores from counting as a warning.
    - name: eslint
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
    # Package boundaries (.dependency-cruiser.cjs). The whole graph, since a staged file
    # can close a cycle elsewhere; `--cache` skips files unchanged since the last run.
    - name: package boundaries
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json}"
      run: pnpm -s lint:deps --cache --no-progress
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm -s typecheck --output-logs=errors-only
    # The Postgres tests skip here even when TEST_DATABASE_URL is set; CI runs them.
    - name: unit tests
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json}"
      run: pnpm -s test:unit
      env:
        TEST_DATABASE_URL: ""
    # The coverage checks read git's tracked files, so here, after staging, they see new
    # files that a run before `git add` would miss. CI runs them too.
    - name: typecheck coverage
      glob: "*.{ts,tsx,mts,cts,json}"
      run: node tools/typecheck-coverage/check-typecheck-coverage.mjs
    - name: test coverage
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: node tools/test-coverage/check-test-coverage.mjs
    - name: story coverage
      glob: "*.tsx"
      run: node tools/story-coverage/check-story-coverage.mjs
    # Decision records live in docs/architecture/decisions.md; fails if docs/adr/ exists.
    - name: no adr folder
      run: node tools/decision-records/check-no-adr-folder.mjs
    # .claude/skills is the source; fails naming each skill whose .agents/skills copy differs.
    - name: skills in step
      run: node tools/skills-sync/sync-skills.mjs --check
