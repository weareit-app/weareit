# Git hooks, installed by `pnpm install` (lefthook's postinstall runs `lefthook install`).
# Skip once with `git commit --no-verify`, or `LEFTHOOK=0 git commit`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      # Formats only what `.prettierignore` lets through (code, not docs), the same files
      # CI checks with `pnpm run lint`. No glob here, so that file stays the one definition:
      # Prettier 3 skips ignored files passed by name and exits 0, even when all are ignored.
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm -s typecheck --output-logs=errors-only
    - name: unit tests
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json}"
      run: pnpm -s test:unit
    # The coverage checks read git's tracked files, so here, after staging, they see new
    # files that a run before `git add` would miss. CI runs them too.
    - name: typecheck coverage
      glob: "*.{ts,tsx,mts,cts,json}"
      run: node tools/typecheck-coverage/check-typecheck-coverage.mjs
    - name: test coverage
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: node tools/test-coverage/check-test-coverage.mjs
    - name: story coverage
      glob: "*.tsx"
      run: node tools/story-coverage/check-story-coverage.mjs
    # .claude/skills is the source; fails naming each skill whose .agents/skills copy differs.
    - name: skills in step
      run: node tools/skills-sync/sync-skills.mjs --check
