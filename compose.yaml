name: weareit

services:
  postgres:
    # Image pin: docs/architecture/ci-actions.md ("Images"); CI runs the same one.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: it
      POSTGRES_PASSWORD: it
      POSTGRES_DB: it_dev
    ports:
      - "5432:5432"
    volumes:
      - it-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it -d it_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  it-postgres-data:
