services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: it
      POSTGRES_PASSWORD: it
      POSTGRES_DB: it_dev
    ports:
      - "5432:5432"
    volumes:
      - it-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it -d it_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  it-postgres-data:
