# Runs the typecheck, lint, the Vitest and jest-expo tests, and the Playwright web
# tests on every pull request and push to master, so a commit made with
# `git commit --no-verify` is still checked.
# Runner costs and action pins: docs/architecture/dependency-policy.md. Read it
# before changing `runs-on`.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action must be SHA-pinned and recorded in dependency-policy.md. Runs before
      # the setup action so its pins are checked before they run; the runner's Node is enough.
      - run: node tools/action-pins/check-action-pins.mjs

      - uses: ./.github/actions/setup

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test:unit

      - run: pnpm run test:expo

  # Separate job so the slower browser tests don't hold up the checks above.
  e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/app/test-results/
          retention-days: 7
