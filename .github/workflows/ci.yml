# Runs the typecheck, lint, the Vitest and jest-expo tests, the Playwright web
# tests and a render of every Storybook story on every pull request and push to
# master, so a commit made with `git commit --no-verify` is still checked. A pull
# request that changes only docs Markdown runs a lighter set (see the `changes` job).
# What each job runs and what it costs: docs/architecture/dependency-policy.md
# ("Continuous integration"). Update it when a job's steps, services or runner change.
# Action and image pins and their reviews: docs/architecture/ci-actions.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request changes only docs. Why the other jobs skip with
  # job-level `if:` and run in full when this job fails: dependency-policy.md
  # ("Continuous integration").
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # A pull request checks out its merge commit. GitHub doesn't document its
          # parent order; the first parent was the base on #190, so diffing the two
          # gives the pull request's changes. docs/research/ci-docs-only-gating/research.md.
          fetch-depth: 2

      - id: classify
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The diff below assumes the merge commit's first parent is the base, which
            # GitHub doesn't document. If the second parent isn't the head, run everything.
            if [ "$(git rev-parse HEAD^2 2>/dev/null)" != "$PR_HEAD_SHA" ]; then
              echo "Unexpected merge commit parents; running everything."
            else
              # --no-renames lists a moved file under its old path too, so moving code
              # into a docs folder isn't read as docs-only.
              changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
              printf 'Changed files:\n%s\n' "$changed"
              # Docs-only when every file is Markdown at the root or under a docs folder.
              # An allowlist, so a new folder runs everything until it's added here.
              # tools/docs-only-inputs fails if code these runs skip names a spec folder.
              # A here-string rather than a pipe, so pipefail can't flip the result.
              if [ -n "$changed" ] && ! grep -q -v -E \
                '^([^/]+|(docs|openspec|specs|\.specify)/.+)\.md$' <<<"$changed"; then
                docs_only=true
              fi
            fi
          fi
          echo "Docs only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  # On a docs-only pull request this runs only the checks that read Markdown: the
  # action pins check, lint (Prettier and the essay check), and the Python tool tests.
  check:
    name: Typecheck, lint and unit tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A disposable Postgres server for the repository tests in packages/database/src,
    # which fail in CI without TEST_DATABASE_URL (locally they skip).
    # Image pin: docs/architecture/ci-actions.md.
    # GitHub's PostgreSQL service-container guide uses these health-check options to
    # "wait until postgres has started", and a job on the runner reaches the service at
    # localhost through the mapped port (checked 2026-10-21 against docs.github.com,
    # "Creating PostgreSQL service containers").
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: it
        ports:
          - 54346:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action must be SHA-pinned and reviewed in ci-actions.md. Runs before
      # the setup action so its pins are checked before they run; the runner's Node is enough.
      - run: node tools/action-pins/check-action-pins.mjs

      # No code that docs-only pull requests skip may name a spec folder the docs-only
      # allowlist covers. Runs on every pull request, since a spec reader arrives in a
      # code pull request. Needs only the runner's Node.
      - run: node tools/docs-only-inputs/check-docs-only-inputs.mjs

      # Decision records live in docs/architecture/decisions.md; fails if docs/adr/ exists.
      - run: node tools/decision-records/check-no-adr-folder.mjs
      # .claude/skills is the source; .agents/skills must be its copy (openspec-* skipped).
      - run: node tools/skills-sync/sync-skills.mjs --check

      - uses: ./.github/actions/setup

      # Regenerating the committed generated files must change nothing: the essay modules
      # (packages/content/src/*.generated.ts) and the table types (packages/database/src/db.ts,
      # from a freshly migrated database), so neither can land stale. It runs before the
      # typecheck, whose turbo `essays` dependency would rebuild the modules first.
      - run: pnpm run check:generated
        if: needs.changes.outputs.docs-only != 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:it@localhost:54346/postgres

      - run: pnpm run typecheck
        if: needs.changes.outputs.docs-only != 'true'

      # Every tracked TypeScript file must be in a project the typecheck above ran.
      - run: node tools/typecheck-coverage/check-typecheck-coverage.mjs
        if: needs.changes.outputs.docs-only != 'true'

      # Every tracked test file must be collected by Vitest or the app's Jest config.
      - run: node tools/test-coverage/check-test-coverage.mjs
        if: needs.changes.outputs.docs-only != 'true'

      # Every UI component must have stories or an allowlist entry with a reason.
      - run: node tools/story-coverage/check-story-coverage.mjs
        if: needs.changes.outputs.docs-only != 'true'

      - run: pnpm run lint
        if: needs.changes.outputs.docs-only != 'true'

      # The Python tools, with ruff through uv (ruff.toml). The runner image ships pipx;
      # uv's pin: docs/architecture/dependency-policy.md.
      - run: pipx install uv==0.13.0
        if: needs.changes.outputs.docs-only != 'true'
      - run: pnpm run lint:py
        if: needs.changes.outputs.docs-only != 'true'

      # Unused files, exports, and dependencies, and dependencies used but not
      # declared (knip.jsonc). Knip's Expo plugin loads the app config, which parses
      # the app's public variables, so it gets the example's, as the jest-expo step does.
      - run: pnpm run knip
        if: needs.changes.outputs.docs-only != 'true'
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3001/rpc

      # Two workspace packages declaring different versions of one dependency.
      - run: pnpm run sherif
        if: needs.changes.outputs.docs-only != 'true'

      - run: pnpm run test:unit
        if: needs.changes.outputs.docs-only != 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres:it@localhost:54346/postgres

      # jest-expo reads the app config, which parses the app's public variables
      # (apps/app/src/env.ts); CI has no apps/app/.env, so it gets the example's.
      - run: pnpm run test:expo
        if: needs.changes.outputs.docs-only != 'true'
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3001/rpc

      # The research tools (pain catalog, possibility generator, copy checks) are stdlib Python.
      - run: pnpm run test:tools

  # Separate job so the slower browser tests don't hold up the checks above.
  e2e:
    name: Web end-to-end tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/app/test-results/
          retention-days: 7

  # Renders every Storybook story in light and dark; fails when one doesn't render.
  # docs/architecture/storybook.md.
  stories:
    name: Storybook stories render
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm storybook:review --no-base

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-review
          path: |
            apps/app/storybook-review/index.html
            apps/app/storybook-review/head/
          retention-days: 7
